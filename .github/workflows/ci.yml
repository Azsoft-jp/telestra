# Phase 00の契約とMock試験を実行する。デプロイ権限や秘密値を扱う工程は設けない。
name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # 固定版の公開依存物だけを取得し、以降のGo検査では取得を禁止する。
      - run: go mod download && go mod verify
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: telestra-local-evidence
          path: |
            artifacts/phase00-results.json
            artifacts/phase01-results.json
            artifacts/go-results.json
            artifacts/*test-output.txt
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: go mod download && go mod verify
      # ツールは固定版を取得する。秘密値や環境資格を渡さない。
      - run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner
      - run: gitleaks git . --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner
      - run: node --experimental-strip-types scripts/publication-scan.ts --require-history
      - run: govulncheck ./...
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3の確認済みcommit
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      # 構成契約だけをplanし、Cloudflare/AWS資源の作成とapplyは行わない。
      - run: terraform -chdir=ops/terraform/frontend-contract fmt -check
      - run: terraform -chdir=ops/terraform/frontend-contract init -backend=false -input=false
      - run: terraform -chdir=ops/terraform/frontend-contract validate
      - run: terraform -chdir=ops/terraform/frontend-contract test
      - run: terraform -chdir=ops/terraform/frontend-contract plan -input=false -lock=false
