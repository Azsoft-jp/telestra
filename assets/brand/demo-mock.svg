<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><!-- README用に描いた画面構成のモック。実画面のスクリーンショットではない。 --><title id="title">Telestraの画面構成モック</title><desc id="desc">合成データ2444バイト、原本4チャンク、映像再生は未実装と表示した画面構成案</desc><rect width="1120" height="530" fill="#eef3f5"/><rect x="0" y="0" width="1120" height="76" fill="#102e42"/><g font-family="system-ui,sans-serif"><text x="40" y="50" font-size="32" font-weight="700" fill="#fff">Telestra</text><text x="810" y="48" fill="#59e0cb" font-size="20">LOCAL DEMO</text><text x="40" y="130" fill="#005f67" font-size="22">Broadcast, unbound.</text><text x="40" y="180" fill="#123042" font-size="35" font-weight="700">録画を、ひとつの機器に閉じ込めない。</text><rect x="40" y="210" width="1040" height="55" fill="#dceff0"/><text x="60" y="246" font-size="20" fill="#123042">画面構成のモックです。実放送・実録画・映像再生はありません。</text><g fill="#fff" stroke="#b5c8d2"><rect x="40" y="292" width="330" height="110"/><rect x="395" y="292" width="330" height="110"/><rect x="750" y="292" width="330" height="110"/></g><g fill="#123042"><text x="65" y="325" font-size="18">原本バイト</text><text x="65" y="376" font-size="38">2,444</text><text x="420" y="325" font-size="18">原本チャンク</text><text x="420" y="376" font-size="38">4</text><text x="775" y="325" font-size="18">映像再生</text><text x="775" y="376" font-size="32">未実装</text><text x="40" y="462" font-size="20">模擬変換の結果を取得しました。映像再生は未実装です。</text><text x="40" y="505" font-size="16">説明用モック · SAP Fundamental Stylesを使うローカルDemoを別途提供</text></g></g></svg>